name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu:
        description: Run GPU conformance on the self-hosted opencl-gpu runner
        type: boolean
        required: false
        default: false

env:
  CARGO_BUILD_JOBS: "1"

jobs:
  rust:
    name: Lint and Test (stable, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - complex
          - stream
          - complex,stream
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap local path dependencies
        run: bash .github/scripts/bootstrap-path-deps.sh

      - name: Install numerical test dependencies
        run: sudo apt-get update && sudo apt-get install -y m4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Ensure components present
        run: |
          rustup component add clippy rustfmt || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Test
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --features "${{ matrix.features }}"
          else
            cargo test
          fi

      - name: Native lint
        run: cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings


  native-release:
    name: Native release numerical conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/bootstrap-path-deps.sh
      - run: sudo apt-get update && sudo apt-get install -y m4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: "cargo test --release --features complex --lib numerics:: --target-dir target/host-release"

  opencl-cpu:
    name: OpenCL CPU numerical conformance
    runs-on: ubuntu-latest
    env:
      CC: /usr/bin/cc
      CXX: /usr/bin/c++
      M4: /usr/bin/m4
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/cc
      HA_NDARRAY_OPENCL_DEVICE: CPU
      POCL_CACHE_DIR: /tmp/ha-ndarray-pocl
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local path dependencies
        run: bash .github/scripts/bootstrap-path-deps.sh

      - name: Install CPU OpenCL and oracle build dependencies
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd ocl-icd-opencl-dev clinfo build-essential m4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: clinfo -l
      - run: cargo test --all-targets --features opencl,complex --target-dir target/opencl-tests
      - run: "cargo test --release --features opencl,complex --lib numerics:: --target-dir target/opencl-tests"
      - run: cargo test --doc --all-features --target-dir target/opencl-tests
      - run: cargo clippy --all-targets --all-features --target-dir target/opencl-tests -- -D warnings

  opencl-gpu:
    name: OpenCL GPU numerical conformance
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    runs-on: [self-hosted, linux, x64, opencl-gpu]
    env:
      CC: /usr/bin/cc
      CXX: /usr/bin/c++
      M4: /usr/bin/m4
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/cc
      HA_NDARRAY_OPENCL_DEVICE: GPU
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local path dependencies
        run: bash .github/scripts/bootstrap-path-deps.sh

      - uses: dtolnay/rust-toolchain@stable
      - name: Require installed OpenCL runtime and oracle tools
        run: clinfo -l && m4 --version
      - run: cargo test --all-targets --features opencl,complex --target-dir target/opencl-gpu-tests
      - run: "cargo test --release --features opencl,complex --lib numerics:: --target-dir target/opencl-gpu-tests"

  wasm:
    name: WASM build and Node smoke tests
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/bootstrap-path-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM libraries
        run: |
          cargo build --manifest-path Cargo.toml --lib --target wasm32-unknown-unknown
          cargo build --manifest-path Cargo.toml --lib --target wasm32-unknown-unknown --features wasm,complex,stream
      - name: Install source-matched WASM test runner
        run: bash .github/scripts/install-wasm-runner.sh
      - name: Run focused Node tests
        run: |
          cargo test --manifest-path Cargo.toml --test wasm --target wasm32-unknown-unknown
          cargo test --manifest-path Cargo.toml --test wasm --target wasm32-unknown-unknown --features wasm,complex,stream
